common:
  save_config: false

sim_logger:
  animation_enabled: false

map:
  # path from pkg share dir
  yaml_path: "env/final_ver3/occupancy_grid_map.yaml"

waypoints:
  # path from pkg share dir
  # csv_path: "maps/occupancy_grid_map_waypoints.csv"
  csv_path: ""

obstacles:
  # path from pkg share dir
  csv_path: "" # If empty, the obstacles information will be subscribed from the topic
  # csv_path: "maps/occupancy_grid_map_obstacles.csv"
  radius: 1.25

reference_path:
  update_by_topic: false # When true, 'circle' must be false
  # path from pkg share dir
  # csv_path: ""
  # THE ONE CHANGE from the proven 47.28 s baseline: the racing line.
  #
  # 329.8 m against the official 346.0 m. tools/widen_line.py applied to
  # traj_top36_fitted (the 36.319 s run's line) with target 1.6 m and the shift
  # capped at 0.4 m, which is the setting that buys clearance WITHOUT buying
  # curvature:
  #
  #   line      length  min clear  under 1.0 m  |kappa|max  max ay at 30 km/h
  #   official   346.0    1.68 m        0         0.236          16.38
  #   fitted     328.6    0.76 m       10         0.231          16.05
  #   this       329.8    0.98 m        1         0.236          16.37
  #   target 1.8 331.6    1.12 m        0         0.245          17.00
  #
  # Both earlier attempts failed for opposite reasons and both are measured:
  # fitted has one centimetre of margin over the 0.75 m half-width and wedged 43
  # times (96.08 s average, but 45.43 s on a clean lap). Widening to 1.8 m fixed
  # that (4 wedges) and broke something else -- pushing points out raised peak
  # curvature to 0.245, taking the lateral demand to 17.0 m/s^2 against the 15.41
  # p95 the 36 s run actually held, and three laps still ran 57-64 s.
  #
  # This one keeps curvature at the official line's own 0.236, so it asks nothing
  # of grip that the 47.28 s baseline does not already survive cleanly.
  csv_path: "env/final_ver3/traj_top36_blend45.csv"
  # Continuous per-waypoint speed profile (the CSV branch). The 2.55 m/s pin
  # that killed this path was a double km/h->m/s conversion in
  # mpc_controller.py (fixed): mpc_cfg.v_max is already m/s.
  # Profile: generate_min_time_profile.py on the blend45 line,
  # a_max 0.6 (vehicle real ~0.64), a_min -1.4, ay_max 13, v_max 40 km/h.
  # Corner speed 7.52 m/s = proven x1.10 corner pace; only adds ramped straights.
  use_csv_speed_profile: true
  speed_profile_csv_path: "env/final_ver3/traj_blend45_mt_ay13.csv"
  resolution: 0.6
  smoothing_distance: 2  # tested 5 -> much worse (76.59s vs ~50s baseline), reverted
  max_width: 3.0  # testing: narrower corridor to see if it forces tighter tracking through wp82-88/129-134
  circular: true
  use_path_constraints_topic: true  # re-enabled for overtaking per user request: self-play showed no performance cost (46.87/47.31/47.35s, identical to avoidance-off)
  use_border_cells_topic: true
  # use_path_constraints_topic: true
  # use_border_cells_topic: true

bicycle_model:
  length: 1.087
  # width: 1.45   # real machine width
  width: 1.50   # A/B/C tested vs 2.30/1.80 in 3-way self-play: Lap1 71.46->68.06->55.56s
                # (steady-state Lap2/3 unchanged ~50s); narrower corridor lets the MPC
                # route around blocked rivals at corner 1 instead of queueing behind them

mpc:
  N: 20  # tested N=30 -> no improvement (53s vs 50s baseline), reverted
  # Q: [e_y, e_psi, t]
  # R: [v, delta]
  # QN: [e_y, e_psi, t]
  R: [100000.0, 0.0]  # tested 10000 -> neutral (54.44/60.02/50.20/49.67s, no clear gain), reverted
  a_min: -1.6 # m/s^2 -- tested -2.7 -> identical (48.89/47.43/47.49/47.40/47.08), no separate braking headroom either. Reverted.
  a_max: 1.35 # m/s^2 -- CONFIRMED: real JAAIC regulation allows up to 3.0 m/s^2, but tested a_max=2.7 (near that ceiling) gave IDENTICAL lap times to 1.35 (48.27/47.33/46.96/47.23/47.40 vs 48.50/47.33/46.52/47.14/47.04). This proves the true bottleneck is THIS vehicle's own physical acceleration capability (AWSIM handicap: 1.37 m/s^2, source: vehicle), not the more generous rule ceiling. wp82-88's diagnosed ~3.3 m/s^2 requirement is infeasible for this vehicle regardless of rules -- mincurv's reference speed profile assumed unrealistic accel there. 1.35 is the real optimum.
  delta_max_deg: 36.0 # degrees -- testing: vehicle's max_steer_angle param is 0.64 rad (~36.7 deg), we were self-limiting to 32
  steer_rate_max: 0.35 # rad/s
  control_rate: 40.0 # Hz -- tested 50Hz solo -> IDENTICAL (48.50/47.20/46.72/46.97s). Reverted.
  steering_tire_angle_gain_var: 1.639
  # steering_tire_angle_gain_var: 1.0
  # accel_low_pass_gain: 0.1
  # steer_low_pass_gain: 0.3
  accel_low_pass_gain: 1.0  # tested 0.1 solo -> IDENTICAL (48.72/47.25/47.10/47.35s). Reverted.
  steer_low_pass_gain: 1.0
  wp_id_offset: 2
  use_max_kappa_pred: true  # tested false in solo isolation -> IDENTICAL (48.42/47.19/47.14/46.78/47.23s vs baseline). Self-play "promise" was traffic noise again. Reverted to proven true.


  ## ---------- 究極 ------------- ##
  ## Lap1: 53s, Lap2: 47s

  # v_max: 30.0   # km/h
  # ay_max: 12.0  # m/s^2, maximum lateral acceleration in curves
  # Q: [600000.0, 100000000.0, 2000000.0]
  # QN: [1000000.0, 1000000.0, 10000.0]

  ## --- 高速 (gnss delay 0.3) --- ##
  ## Lap1: 55s, Lap2: 49s

  # v_max: 30.0
  # ay_max: 9.5
  # Q: [1000000.0, 100000000.0, 850000.0]
  # QN: [1000000.0, 1000.0, 10000.0]

  ## --- 高速 (gnss delay 0.4) --- ##
  ## Lap1: 55s, Lap2: 49s

  # v_max: 30.0
  # ay_max: 9.5
  # Q: [1000000.0, 100000000.0, 1850000.0]
  # QN: [1000000.0, 1000.0, 10000.0]

  ## --- 中高速 --- ##
  ## Lap1: 59s, Lap2: 54s
  # v_max: 25.0
  # ay_max: 7.0
  # Q: [1000000.0, 100000000.0, 850000.0]
  # QN: [1000000.0, 1000.0, 10000.0]

  ## --------- 中速 -------------- ##
  ## Lap1: 67s, Lap2: 64s

  v_max: 40.0  # raised from 33 per the actual regulation ceiling
  ay_max: 20.0  # tested 28 -> identical to a_max-only gain (46.89-48.28s), no additional benefit. Reverted.
  Q: [1000000.0, 100000000.0, 1850000.0]  # tested e_y weight 2M in solo isolation -> IDENTICAL to 1M (49.12/47.71/47.56/47.90s vs 48.50/47.33/46.52/47.14/47.04s). The earlier 3-way self-play "win" was spawn-order noise, not a real effect. Reverted to proven 1M.
  QN: [1000000.0, 1000000.0, 10000.0]  # testing: e_psi terminal weight raised 1000x to match order of Q's e_psi (100M), to see if it tightens corner-exit tracking (wp82-88/129-134)

  ## -------- 低速 -------------- ##
  ## Lap1: 86s

  # v_max: 15.0
  # ay_max: 5.5
  # Q: [5000000.0, 100000000.0, 200000.0] # 低速だとインを攻めがちなので、あえて外に膨らむパラメータ
  # QN: [1000000.0, 1000.0, 10000.0]

v2x_obstacle_avoidance:
  vehicle_radius: 0.35         # [m] reduced to avoid MPC corridor infeasibility when boxed in
  v_max_safety: 30.0           # [m/s]
  position_jump_threshold: 5.0 # [m]
