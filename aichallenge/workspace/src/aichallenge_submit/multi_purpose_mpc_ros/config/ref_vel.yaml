# Proven baseline speeds, section boundaries remapped onto the 36 s racing line.
#
# Speeds are exactly the baseline's (output/20260728-172948, measured 48.40 /
# 47.14 / 46.96 / 47.04 / 47.13 / 47.05 s): straights 30, s4 22, s6 22, s8 25.
# Raising the corners was tried today and does NOT work on this track: with
# s4/s6 at 30 and s8 at 31 the car stopped dead 47 m in, at full steering lock.
# Those speeds came from the 36 s run's telemetry, but that run held them on its
# OWN 325 m line, not on the 346 m official one. The corner speeds were never the
# free money they looked like.
#
# So this changes the LINE instead, which is where the 36 s run's real advantage
# is: 323.6 m against the official 346.0 m. All four official path versions
# (final, ver2, ver3, ver4) are within 1.5 m of each other, so the 20 m is not
# something the official repo offers -- the winner used track width to cut inside
# mincurv.
#
# wp_id values are NOT the official ones: section boundaries are indices into the
# resampled path, and a different line resamples differently. Each boundary was
# remapped to the nearest waypoint on the new line (max coordinate offset 1.73 m,
# indices still monotonic). Waypoints 1..55 map with zero offset, so the start
# geometry is unchanged.
#
# tools/lap_time_model.py: 45.31 s -> 42.21 s predicted for the same speeds.
ref_vel_configulator:
  s1:
    ref_vel: 30.0
    wp_id: 1
  s1_1:
    ref_vel: 30.0
    wp_id: 30
  s2:
    ref_vel: 30.0
    wp_id: 55
  s3:
    ref_vel: 30.0
    wp_id: 102
  s4:
    ref_vel: 22.0
    wp_id: 159
  s5:
    ref_vel: 30.0
    wp_id: 191
  s6:
    ref_vel: 22.0
    wp_id: 265
  s7:
    ref_vel: 30.0
    wp_id: 289
  s8:
    ref_vel: 25.0
    wp_id: 321
  s9:
    ref_vel: 30.0
    wp_id: 335
