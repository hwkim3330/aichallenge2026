# Uniform x1.08 of the proven shape, with braking lead-ins.
#
# The only family that works. Per-section grip ceilings have now failed three
# times -- with and without lead-ins, coarse and fine -- because the model's grip
# arithmetic assumes perfect tracking and the MPC will not follow large swings
# between adjacent sections. Uniform scaling keeps every step in proportion.
#
# x1.10 of this construction measured 44.54 s (6/6 clean, 0 recoveries).
# Peak lateral demand here: 18.46 m/s^2 (x1.10 is 19.15, and 20.93 failed).
