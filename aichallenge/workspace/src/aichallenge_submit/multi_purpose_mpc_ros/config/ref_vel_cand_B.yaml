# x1.10 speeds with braking lead-ins at the three transitions that need them.
#
# x1.10 alone runs 44.2 s clean laps and throws two of six away (53.88, 53.56). The
# rosbag puts the loss at waypoint 149, where |kappa| is 0.006 -- a straight. The
# cause is the transition six waypoints later: s3 33.0 -> s4 24.2 km/h needs 12.1 m
# of braking at a_min -1.6 and has 6 m, so the controller over-brakes down to
# 3.09 m/s and loses about 5 s on the spot.
#
# ref_vel gives no lookahead, so the fix is an intermediate section placed far
# enough back that each half of the drop fits:
#
#   transition        needs    lead-in at    speed    distance available
#   s3 33.0 -> 24.2   12.1 m   wp139         28.6     15.9 m
#   s5 33.0 -> 24.2   12.1 m   wp248         28.6     15.8 m
#   s7 33.0 -> 27.5    8.0 m   wp309         30.2     10.5 m
#
# Three added sections, not thirty-two. A 32-section version of this idea averaged
# 68.45 s: at ~10 m spacing update_v_max changes about once a second and the solver
# never settles. Adding sections only where the braking maths demands them keeps the
# rest coarse.
#
# tools/lap_time_model.py: 40.59 s predicted.
#
# MEASURED, solo eval, six laps, no recoveries:
#   46.13 / 44.10 / 44.17 / 44.42 / 44.00 / 44.43   average 44.54, best 44.00
#
# So the diagnosis held: x1.10's two lost laps were the transition, not the speed.
# Same speeds, three added sections, and the 9.5 s losses are gone.
#   47.28 baseline -> 46.53 (line) -> 45.35 (x1.05) -> 44.54 (x1.10 + lead-ins)
ref_vel_configulator:
  s1:
    ref_vel: 33.0
    wp_id: 1
  s1_1:
    ref_vel: 33.0
    wp_id: 30
  s2:
    ref_vel: 33.0
    wp_id: 55
  s3:
    ref_vel: 33.0
    wp_id: 100
  s3b:
    ref_vel: 28.6
    wp_id: 139
  s4:
    ref_vel: 24.2
    wp_id: 155
  s5:
    ref_vel: 33.0
    wp_id: 190
  s5b:
    ref_vel: 28.6
    wp_id: 248
  s6:
    ref_vel: 24.2
    wp_id: 265
  s7:
    ref_vel: 33.0
    wp_id: 290
  s7b:
    ref_vel: 30.2
    wp_id: 309
  s8:
    ref_vel: 27.5
    wp_id: 320
  s9:
    ref_vel: 33.0
    wp_id: 335
