/**:
  ros__parameters:
    log_interval_sec: 5.0        # 推論統計ログを出す間隔（秒）
    
    model:
      input_dim: 750            # LiDARスキャンの入力次元
      output_dim: 2              # 出力（steering, throttleなど）
      architecture: "normal"      # "normal" または "small"
      ckpt_path: "/path/to/tinylidarnet_weights.npy"

    max_range: 30.0              # LiDARの最大レンジ（メートル）
    # "ai" uses the network's first head; "fixed" throws it away and publishes `acceleration`
    # below as a constant. It was "fixed", which is why the node reported head0 = +0.600 exactly,
    # unchanged across a complete retrain: 0.600 is the constant, not a prediction. Every speed
    # target, mapping and retraining result was being discarded at this line.
    control_mode: "ai"
    acceleration: 0.6            # 固定加速度コマンド mode:fixed の場合に使用

    debug: false
