/**:
  ros__parameters:
    log_interval_sec: 5.0        # 推論統計ログを出す間隔（秒）
    
    model:
      input_dim: 750            # LiDARスキャンの入力次元
      output_dim: 2              # 出力（steering, throttleなど）
      architecture: "normal"      # "normal" または "small"
      ckpt_path: "/path/to/tinylidarnet_weights.npy"

    max_range: 30.0              # LiDARの最大レンジ（メートル）
    # Straight-line speed cap for the longitudinal loop. Raised from the node's 10.0 default after a
    # 3-car collisions-off comparison (batch PACE1) in which 11.0 with TLN_LON_KP 1.8 gave a best
    # flying lap of 44.09 s and a mean flying lap of 44.40 s, against 48.38 / 48.58 for 9.5 with
    # kp 1.0 in the same race. TLN_MAX_SPEED still overrides this.
    max_speed_mps: 11.0
    control_mode: "fixed"          # "ai" or "fixed" -- July used fixed: network steers, speed is a
                                    # setpoint integrated from the MEASURED velocity plus a constant accel
    acceleration: 0.6            # 固定加速度コマンド mode:fixed の場合に使用

    debug: false
